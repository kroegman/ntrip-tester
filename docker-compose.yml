services:
  ntrip-console:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-1000}
      START_RATE_PER_SECOND: ${START_RATE_PER_SECOND:-20}
      MAX_CHURN_PER_TICK: ${MAX_CHURN_PER_TICK:-50}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
